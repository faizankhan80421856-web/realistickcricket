<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Realistic Cricket 5.0</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#78d2ff;display:flex;justify-content:center}
.game{width:min(460px,100%);min-height:100vh;background:#087b3e;color:#fff;padding:12px}
h1{text-align:center;margin:3px}.owner{text-align:center;font-size:12px;margin-bottom:8px}
.score{display:flex;justify-content:space-between;background:#063b28;padding:12px;border-radius:13px;font-weight:bold}
.stadium{height:420px;margin:10px 0;border:4px solid #245d2b;border-radius:18px;position:relative;overflow:hidden;background:radial-gradient(ellipse,#69c85b 0 25%,#39a747 65%,#25863a)}
.pitch{position:absolute;left:23%;right:23%;top:12px;bottom:12px;background:#c69b65;border:3px solid #f8e9c3}
.line{position:absolute;left:8%;right:8%;height:4px;background:#fff}.a{top:64px}.b{bottom:64px}
.bowler{position:absolute;top:48px;left:50%;width:18px;height:68px;background:#163b25;border-radius:10px;transform:translateX(-50%);transition:.4s;z-index:2}
.bowler:before{content:"";position:absolute;width:25px;height:25px;background:#dca77a;border-radius:50%;left:-3px;top:-25px}
.arm{position:absolute;width:55px;height:9px;background:#163b25;border-radius:9px;right:-39px;top:24px;transform:rotate(-30deg);transform-origin:left}
.batsman{position:absolute;bottom:67px;left:50%;width:19px;height:72px;background:#173c25;border-radius:10px;transform:translateX(-50%);z-index:2}
.batsman:before{content:"";position:absolute;width:25px;height:25px;background:#dca77a;border-radius:50%;left:-3px;top:-26px}
.leg1,.leg2{position:absolute;width:11px;height:48px;background:#173c25;top:55px;border-radius:8px}.leg1{left:-4px;transform:rotate(8deg)}.leg2{right:-4px;transform:rotate(-8deg)}
.bat{position:absolute;width:11px;height:83px;background:#a96b2f;border-radius:5px;right:-37px;top:12px;transform:rotate(-32deg);transform-origin:bottom;transition:.16s}
.ball{position:absolute;width:18px;height:18px;background:#c62828;border-radius:50%;left:50%;top:78px;transform:translateX(-50%);z-index:3;transition:top .55s, left .3s}
.msg{text-align:center;min-height:24px;font-weight:bold}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
button{border:0;border-radius:11px;padding:13px 3px;font-weight:bold;font-size:14px}button:active{transform:scale(.97)}
.start{display:block;width:90%;margin:10px auto;background:#ffd21a}.info{text-align:center;font-size:12px;background:#075c35;border-radius:10px;padding:8px}
.overlay{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center}.card{background:#fff;color:#073b27;width:84%;padding:23px;border-radius:20px;text-align:center}
</style></head><body><main class="game">
<h1>🏏 Realistic Cricket 5.0</h1><div class="owner">Manager / Owner: You 👑</div>
<div class="score"><span id="score">0/0</span><span id="overs">0.0 overs</span></div>
<div class="stadium"><div class="pitch"><div class="line a"></div><div class="line b"></div>
<div id="bowler" class="bowler"><i class="arm"></i></div><div id="ball" class="ball"></div>
<div id="batsman" class="batsman"><i class="bat" id="bat"></i><i class="leg1"></i><i class="leg2"></i></div></div></div>
<div id="msg" class="msg">START दबाकर मैच खेलें</div>
<div class="controls">
<button onclick="shot('def')">🛡️ DEFEND</button><button onclick="shot('one')">1️⃣ SINGLE</button><button onclick="shot('two')">2️⃣ TWO</button>
<button onclick="shot('four')">4️⃣ FOUR</button><button onclick="shot('six')">6️⃣ SIX</button><button onclick="bowl()">🏃 BOWL</button>
</div><div class="info">2 overs • 5 wickets • Timing batting • Original game</div>
<button class="start" onclick="restart()">🔄 NEW MATCH</button>
<div id="overlay" class="overlay"><div class="card"><h2>🏏 Realistic Cricket 5.0</h2><p>Bowler run-up और animated stick batsman</p><b>Manager / Owner: You 👑</b><button class="start" onclick="restart()">START MATCH</button></div></div>
<script>
let runs=0,wickets=0,balls=0,active=false,ended=false;
const $=id=>document.getElementById(id);
function update(){$('score').textContent=runs+'/'+wickets;$('overs').textContent=Math.floor(balls/6)+'.'+balls%6+' overs'}
function bowl(){
 if(active||ended)return;active=true;$('msg').textContent='🏃 Bowler run-up...';
 $('bowler').style.transform='translateX(-50%) translateY(42px)';
 setTimeout(()=>{$('ball').style.top='315px';$('msg').textContent='🏏 SHOT NOW!'},420);
 setTimeout(()=>{if(active){active=false;$('msg').textContent='⏰ Missed — dot ball';nextBall()}},950)
}
function shot(type){
 if(!active||ended)return;active=false;
 $('bat').style.transform='rotate(55deg)';
 setTimeout(()=>$('bat').style.transform='rotate(-32deg)',180);
 const chance={def:.97,one:.86,two:.76,four:.63,six:.46}[type];
 const value={def:0,one:1,two:2,four:4,six:6}[type];
 if(Math.random()>chance){wickets++;$('msg').textContent='❌ WICKET!'}
 else {$('msg').textContent=value===0?'🛡️ Excellent defence!':'🔥 '+value+' RUN'+(value>1?'S':'')+'!';runs+=value}
 nextBall()
}
function nextBall(){balls++;update();$('bowler').style.transform='translateX(-50%)';if(wickets>=5||balls>=12){ended=true;$('msg').textContent='🏁 MATCH OVER — '+runs+'/'+wickets;return}setTimeout(bowl,650)}
function restart(){runs=0;wickets=0;balls=0;active=false;ended=false;update();$('overlay').style.display='none';$('msg').textContent='🏃 Get ready...';setTimeout(bowl,500)}
update();
</script></main></body></html>
